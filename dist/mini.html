<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>观物 · 小程序预览</title><link rel="icon" href="assets/favicon.svg"><style>*{box-sizing:border-box}body{margin:0;background:#e9ede4;color:#354539;font-family:"Microsoft YaHei",sans-serif;display:flex;min-height:100dvh;align-items:center;justify-content:center;gap:80px;padding:32px}aside{max-width:340px}small{letter-spacing:3px;font-size:11px;color:#819074}h1{font-family:serif;font-size:44px;font-weight:400;line-height:1.4;margin:24px 0}p{font-size:14px;line-height:2;color:#76816d}nav{display:flex;gap:9px;flex-wrap:wrap;margin-top:24px}button,a{font:inherit;font-size:12px;color:inherit;background:none;border:1px solid #c4ceba;border-radius:25px;padding:10px 15px;text-decoration:none;cursor:pointer}button.active{background:#3f563e;color:white}.phone{width:402px;height:min(870px,calc(100dvh - 48px));padding:9px;border-radius:43px;background:#26362b;box-shadow:0 24px 80px #354b3025;flex-shrink:0;display:flex;flex-direction:column}.wxbar{height:49px;padding:12px 15px;display:flex;justify-content:space-between;align-items:center;background:#f7f7f2;border-radius:34px 34px 0 0;font-size:12px;flex-shrink:0}.wxbar b{font-weight:500}.capsule{border:1px solid #d5d9cf;border-radius:22px;padding:4px 11px;font-size:15px;letter-spacing:4px}iframe{width:100%;height:100%;border:0;border-radius:0 0 34px 34px;background:#f7f7f2}.note{font-size:11px;margin-top:30px}@media(max-width:780px){body{padding:0;display:block}aside{display:none}.phone{width:100%;height:100dvh;padding:0;border-radius:0;box-shadow:none}.wxbar{border-radius:0;height:42px;padding-top:max(10px,env(safe-area-inset-top))}iframe{border-radius:0}}</style></head><body><aside><small>GUANWU · MINI PROGRAM</small><h1>把博物馆，<br>装进口袋。</h1><p>从一座城，到一件文物。<br>细看、听讲、随手记；带上好奇慢慢走。</p><nav><button class="active" data-route="discover">发现</button><button data-route="collection">博物馆</button><button data-route="journeys">城市漫游</button><button data-route="community">同行交流</button><button data-route="saved">我的手记</button></nav><p class="note">当前为浏览器中的小程序尺寸预览。<br>微信原生工程需使用开发者工具导入和发布。</p><a href="index.html">打开完整页面 ↗</a></aside><div class="phone"><div class="wxbar"><b>观物 · 城市博物馆</b><span class="capsule" aria-hidden="true">··· │ ◉</span></div><iframe src="index.html?mode=mini#discover" title="观物小程序交互预览" allow="autoplay; clipboard-write"></iframe></div><script>const frame=document.querySelector('iframe');if(location.hash)frame.src='index.html?mode=mini'+location.hash;document.querySelectorAll('[data-route]').forEach(b=>b.onclick=()=>{frame.contentWindow.location.hash=b.dataset.route;document.querySelectorAll('[data-route]').forEach(x=>x.classList.toggle('active',x===b))});</script></body></html>
